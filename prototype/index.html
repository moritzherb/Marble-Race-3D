<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Marble Machine Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
  /* A full-screen 3D stage with the game UI on top: glossy colourful icons and chunky buttons,
     set in bright indigo frames with a gold trim. The HUD is pinned to the top and bottom edges;
     cards float over a scrim; Success and Time's up are full-screen. */
  :root {
    --table: #39aeb1;       /* the teal studio backdrop */
    --table-deep: #1f7c80;
    --ink: #3b2915;
    --ink-soft: #7a5d3e;
    --cream: #fff4e0;
    --cream-edge: #efcb8f;
    --frame-top: #4654c4;
    --frame-bottom: #2f3a96;
    --frame-edge: #1d2468;
    --hairline: rgba(255, 214, 110, 0.75);
    --gold: #ffcf4d;
    --alarm: #e8321f;
    --go: #1f7c80;
    --scrim: rgba(10, 40, 45, 0.62);
    --font: 'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--table);
    color: var(--ink);
    font: 600 15px/1.35 var(--font);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none; /* no long-press menu or text magnifier on iPhone */
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    background: radial-gradient(ellipse at 50% 42%, #48bdc0 0%, var(--table) 55%, #2c9ca0 100%);
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .gi { display: block; width: 100%; height: 100%; overflow: visible; }
  :is(p, h3, .fine, .why) .gi { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.22em; }

  /* White lettering over the scene, lifted by a soft shadow. */
  .ol {
    color: #fff;
    --o: rgba(18, 70, 78, 0.85);
    text-shadow: 1px 0 0 var(--o), -1px 0 0 var(--o), 0 1px 0 var(--o), 0 -1px 0 var(--o), 0 3px 0 var(--o), 0 4px 10px rgba(0, 0, 0, 0.2);
  }

  /* ---------- Glossy buttons ---------- */
  .gbtn {
    --top: #84dc5e; --bottom: #3aae2c; --rim: #1f7a1a;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 56px;
    padding: 8px 22px 10px;
    border-radius: 18px;
    background: linear-gradient(var(--top), var(--bottom));
    border: 2.5px solid var(--rim);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -4px 0 rgba(0, 0, 0, 0.14), 0 4px 0 var(--rim), 0 8px 18px rgba(0, 0, 0, 0.22);
    color: #fff;
    font: 800 22px/1 var(--font);
    letter-spacing: 0.3px;
    --o: var(--rim);
    text-shadow: 1px 0 0 var(--o), -1px 0 0 var(--o), 0 1px 0 var(--o), 0 -1px 0 var(--o), 0 2px 0 var(--o);
    white-space: nowrap;
    transition: transform 0.08s;
  }
  .gbtn::before { content: ''; position: absolute; left: 9px; right: 9px; top: 3px; height: 40%; border-radius: 13px 13px 26px 26px; background: linear-gradient(rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0)); pointer-events: none; }
  .gbtn:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.14), 0 0 0 var(--rim), 0 4px 10px rgba(0, 0, 0, 0.18); }
  .gbtn:disabled { filter: grayscale(0.85) brightness(0.95); cursor: default; }
  .gbtn .gi { width: 30px; height: 30px; flex: none; }
  .gbtn.blue { --top: #66c4fa; --bottom: #2486e0; --rim: #12509c; }
  .gbtn.orange { --top: #ffbe5c; --bottom: #f57c20; --rim: #a54b0c; }
  .gbtn.red { --top: #ff8270; --bottom: #dc3a26; --rim: #8c1d10; }
  .gbtn.indigo { --top: #6470dc; --bottom: #3a45b0; --rim: #1d2468; }
  .gbtn.cream { --top: #fffdf6; --bottom: #f4e2bf; --rim: #bf9056; color: var(--ink); text-shadow: none; }
  .gbtn.wide { width: 100%; }
  .gbtn.big { min-height: 70px; font-size: 32px; padding: 8px 40px 12px; border-radius: 24px; letter-spacing: 0.5px; }
  .gbtn.square { width: 54px; min-height: 54px; padding: 0; border-radius: 16px; }
  .gbtn.square .gi { width: 34px; height: 34px; }
  .gbtn.round { width: 58px; min-height: 58px; padding: 0; border-radius: 50%; }
  .gbtn.round .gi { width: 34px; height: 34px; }
  .gbtn .cost { display: inline-flex; align-items: center; gap: 3px; font-size: 0.85em; }
  .gbtn .cost .gi { width: 0.95em; height: 0.95em; }
  .gbtn .tag { position: absolute; top: -12px; right: -10px; display: inline-flex; align-items: center; gap: 1px; padding: 2px 7px 2px 3px; border-radius: 999px; background: #fff; border: 2px solid var(--rim); color: var(--alarm); font: 800 14px/1 var(--font); text-shadow: none; }
  .gbtn .tag .gi { width: 20px; height: 20px; }
  .gbtn .badge-video { position: absolute; top: -16px; right: -12px; width: 38px; height: 38px; transform: rotate(10deg); }

  /* ---------- Pills: coins and lives ---------- */
  .pill {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 12px 0 32px;
    margin-left: 14px;
    border-radius: 999px;
    background: rgba(14, 52, 58, 0.72);
    border: 2px solid rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12), inset 0 -2px 0 rgba(0, 0, 0, 0.25), 0 4px 10px rgba(0, 0, 0, 0.15);
    color: #fff;
    font: 800 19px/1 var(--font);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pill > .gi { position: absolute; left: -16px; top: 50%; width: 44px; height: 44px; transform: translateY(-50%); }
  .pill .heart-n { position: absolute; left: -16px; top: 50%; width: 44px; transform: translateY(-50%); padding-top: 2px; text-align: center; font: 800 18px/44px var(--font); text-shadow: 1px 0 0 #7a0e08, -1px 0 0 #7a0e08, 0 1px 0 #7a0e08, 0 -1px 0 #7a0e08, 0 2px 0 #7a0e08; }
  .pill small { font-size: 15px; font-weight: 600; opacity: 0.95; }
  .pill.lives { padding-left: 34px; }
  button.pill:active { transform: translateY(1px); }

  /* ---------- In-level HUD ---------- */
  .top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 6px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .top .left { justify-self: start; }
  .top .centre { display: flex; align-items: flex-start; gap: 10px; }
  .top .centre .pill { height: 28px; margin-top: 10px; font-size: 16px; padding-right: 10px; padding-left: 26px; margin-left: 12px; }
  .top .centre .pill > .gi { width: 36px; height: 36px; left: -13px; }
  .clock { display: grid; justify-items: center; gap: 4px; }
  .clock .face { display: flex; align-items: center; gap: 6px; }
  .clock .face .gi { width: 34px; height: 34px; }
  .clock .num { min-width: 1.6ch; font: 800 44px/1 var(--font); font-variant-numeric: tabular-nums; }
  .clock.low .num { --o: #9c1d0e; animation: pulse 1s ease-in-out infinite; }
  .clock .bar { width: 110px; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.22); overflow: hidden; }
  .clock .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(#fff, #d8f7f5); border-radius: 4px; transform-origin: left; }
  .clock.low .bar i { background: linear-gradient(#ff8270, #e2321f); }
  .clock .paused { font-size: 12px; letter-spacing: 0.5px; color: #fff; opacity: 0.9; }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  .sub {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 84px);
    left: 0;
    right: 0;
    display: grid;
    justify-items: center;
    gap: 7px;
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .level-label { display: inline-flex; align-items: center; gap: 6px; font: 800 21px/1 var(--font); letter-spacing: 0.5px; }
  .level-label .gi { width: 22px; height: 22px; }
  .chips { display: flex; gap: 7px; }
  .chip-marble { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--c); background: rgba(255, 255, 255, 0.25); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: background 0.2s, transform 0.2s; }
  .chip-marble.delivered { background: var(--c); box-shadow: 0 0 0 3px #fff; transform: scale(1.1); }
  .hint { max-width: min(17rem, 100%); background: rgba(255, 255, 255, 0.92); color: var(--ink); padding: 5px 12px; border-radius: 12px; text-align: center; font-size: 14px; line-height: 1.25; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); transition: opacity 0.4s; }
  .hint.gone { opacity: 0; }

  .bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 18px; }
  .controls .gbtn.round { width: 52px; min-height: 52px; }
  .controls .gbtn.round .gi { width: 30px; height: 30px; }
  .controls #restartBtn { width: 62px; min-height: 62px; }
  .controls #restartBtn .gi { width: 36px; height: 36px; }

  /* Power-up tiles: cream, with the icon big and the price on a chip below. */
  .powerbar { display: flex; justify-content: center; gap: 6px; max-width: 100%; }
  .pu {
    position: relative;
    width: 54px;
    height: 62px;
    border-radius: 15px;
    background: linear-gradient(#ffffff, #f3e8d4);
    border: 1.5px solid #d3ae74;
    box-shadow: inset 0 1px 0 #fff, 0 3px 0 #b99560, 0 6px 12px rgba(0, 0, 0, 0.18);
    display: grid;
    justify-items: center;
    align-content: start;
    padding-top: 4px;
  }
  .pu > .gi { width: 36px; height: 36px; }
  .pu .price { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 1px; padding: 1px 6px 1px 2px; border-radius: 999px; background: #2b1a0c; color: #fff; font: 700 12px/16px var(--font); white-space: nowrap; }
  .pu .price .gi { width: 15px; height: 15px; }
  .pu.short .price { background: #9c1d0e; }
  .pu.used { filter: grayscale(1); opacity: 0.55; }
  .pu.armed { transform: translateY(-4px); border-color: #fff; box-shadow: 0 0 0 3px #ffcf3a, 0 3px 0 #b8742c, 0 8px 14px rgba(0, 0, 0, 0.25); }
  /* The glow sits on its own layer and only its opacity animates, so it doesn't repaint. */
  .pu.active::after { content: ''; position: absolute; inset: -2px; border-radius: 16px; box-shadow: 0 0 0 3px #ffcf3a, 0 0 18px rgba(255, 196, 64, 0.95); pointer-events: none; animation: glow 0.9s ease-in-out infinite alternate; will-change: opacity; }
  @keyframes glow { from { opacity: 0.4; } to { opacity: 1; } }
  .pu .meter { position: absolute; left: 6px; right: 6px; bottom: 9px; height: 4px; border-radius: 2px; background: #ff9a0a; transform-origin: left; transform: scaleX(var(--p, 0)); }
  .pu .badge { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: linear-gradient(#ff7ab6, #e8338f); border: 2px solid #fff; color: #fff; font: 700 12px/16px var(--font); }
  .ptag {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 168px);
    transform: translateX(-50%);
    width: min(300px, calc(100vw - 32px));
    background: #fbf6ec;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    padding: 10px 12px 12px;
    display: grid;
    gap: 8px;
    text-align: center;
  }
  .ptag h3 { margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font: 800 18px/1.1 var(--font); color: var(--ink); }
  .ptag h3 .gi { width: 34px; height: 34px; flex: none; }
  .ptag p { margin: 0; font-size: 15px; color: var(--ink-soft); }
  .ptag .why { color: var(--alarm); font-weight: 600; }
  .ptag .gbtn { min-height: 48px; font-size: 20px; }
  .picker { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding: 4px 0; }
  .picker button { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 12%, var(--c) 38%); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 0 0 3px #fff, 0 3px 8px rgba(0, 0, 0, 0.25); }

  /* ---------- Home ---------- */
  body:has(#result:not([hidden])) :is(.top, .sub, .bottom, .ptag) { visibility: hidden; }
  body.at-home :is(.top, .sub, .bottom, .ptag),
  body:has(#home:not([hidden])) :is(.top, .sub, .bottom, .ptag) { display: none; }
  .home-screen {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to bottom, rgba(18, 82, 86, 0.55), rgba(18, 82, 86, 0) 26%, rgba(18, 82, 86, 0) 68%, rgba(18, 82, 86, 0.45));
    pointer-events: none;
    text-align: center;
  }
  .home-screen button { pointer-events: auto; }
  .home-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .home-bar .wallet { display: flex; gap: 6px; align-items: center; }
  .home-bar > :last-child { justify-self: end; }
  .profile { width: 52px; height: 52px; padding: 3px; border-radius: 16px; background: linear-gradient(#f3d58c, #c99a3e); border: 1.5px solid #8a6424; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 3px 0 #8a6424, 0 6px 12px rgba(0, 0, 0, 0.2); }
  .profile .gi { border-radius: 12px; background: #2a6fd8; }
  .home-bar .gbtn.square { width: 52px; min-height: 52px; border-radius: 16px; }
  .home-bar .gbtn.square .gi { width: 36px; height: 36px; }
  .home-bar .pill { height: 32px; }
  .home-bar .pill.lives { min-width: 58px; }
  .logo { margin: 20px auto 0; width: min(320px, 84vw); }
  .logo text { font-family: var(--font); font-weight: 800; }
  .home-play { align-self: end; display: grid; justify-items: center; gap: 14px; padding-bottom: 8vh; }
  .home-level { display: inline-flex; align-items: center; gap: 8px; font: 800 34px/1 var(--font); letter-spacing: 0.5px; }
  .home-level .gi { width: 34px; height: 34px; }
  .home-level.bump { animation: bump 0.55s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes bump { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .hard-tag { text-shadow: none; display: inline-flex; align-items: center; gap: 3px; padding: 3px 10px 3px 4px; border-radius: 999px; background: linear-gradient(#e8604c, #b8321f); border: 1px solid rgba(255, 255, 255, 0.7); font: 800 13px/1 var(--font); letter-spacing: 0.8px; text-transform: uppercase; color: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
  .hard-tag .gi { width: 22px; height: 22px; }
  #playBtn { min-width: 230px; }
  #playBtn.ready { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  .home-foot { display: flex; justify-content: flex-end; }
  .home-foot .gbtn { width: 62px; min-height: 62px; border-radius: 18px; }
  .home-foot .gbtn .gi { width: 38px; height: 38px; }

  /* ---------- Cards: an indigo frame with cream boxes inside ---------- */
  .scrim {
    position: fixed;
    inset: 0;
    background: var(--scrim);
    display: grid;
    grid-template-columns: minmax(0, 400px);
    justify-content: center;
    align-content: center;
    padding-block: calc(env(safe-area-inset-top, 0px) + 22px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-y: auto;
  }
  .card {
    position: relative;
    min-width: 0;
    background: linear-gradient(var(--frame-top), var(--frame-bottom));
    border: 2.5px solid var(--frame-edge);
    border-radius: 26px;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.28), inset 0 0 0 2px rgba(255, 214, 110, 0.35), 0 6px 0 var(--frame-edge), 0 20px 44px rgba(0, 0, 0, 0.36);
    padding: 16px 16px 20px;
    display: grid;
    gap: 14px;
    max-height: 100%;
    overflow-y: auto;
    color: #fff;
    animation: card-in 0.28s cubic-bezier(0.3, 1.5, 0.5, 1);
  }
  @keyframes card-in { from { transform: scale(0.8); opacity: 0; } }
  .card h2 { margin: 2px 44px 0; text-align: center; font: 800 30px/1.1 var(--font); letter-spacing: 0.3px; }
  .card h2::after { content: ''; display: block; width: 48px; height: 4px; margin: 6px auto 0; border-radius: 2px; background: var(--gold); }
  .card h3 { margin: 4px 0 0; font: 600 14px/1.2 var(--font); text-transform: uppercase; letter-spacing: 1px; color: #dfe1ff; }
  .card p { margin: 0; }
  .card .box { background: var(--cream); color: var(--ink); border-radius: 18px; box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 var(--cream-edge); padding: 14px; display: grid; gap: 12px; }
  .card .box p { color: var(--ink-soft); }
  .card .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .card .row > .gbtn:not(.square):not(.round) { flex: 1 1 0; }
  .xbtn { position: absolute; top: 10px; right: 10px; width: 42px; height: 42px; border-radius: 50%; padding: 10px; background: linear-gradient(#ff8270, #dc3a26); border: 2.5px solid #fff; box-shadow: 0 3px 0 #8c1d10, 0 5px 10px rgba(0, 0, 0, 0.25); color: #fff; }
  .xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8c1d10; }
  .big-icon { width: 110px; height: 110px; margin: 0 auto; position: relative; }
  .big-icon .n { position: absolute; inset: 0; display: grid; place-items: center; padding-bottom: 8px; font: 800 38px/1 var(--font); text-shadow: 0 2px 2px rgba(90, 10, 5, 0.5); }
  .big-stat { display: flex; align-items: center; justify-content: center; gap: 10px; font: 800 38px/1 var(--font); font-variant-numeric: tabular-nums; }
  .big-stat .gi { width: 64px; height: 64px; }
  .timer-line { display: flex; align-items: center; justify-content: center; gap: 8px; font: 800 22px/1 var(--font); font-variant-numeric: tabular-nums; }
  .timer-line .gi { width: 34px; height: 34px; }
  .stars { display: flex; gap: 4px; justify-content: center; align-items: flex-end; }
  .stars .gi { width: 44px; height: 44px; }
  .fine { text-align: center; font-size: 14px; color: #e6e7ff; }
  .box .fine { color: var(--ink-soft); }
  .linkish { background: none; padding: 4px; color: #e6e7ff; text-decoration: underline; font-size: 14px; }

  /* Level start: power-up tiles to pick before playing. */
  .boosts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-bottom: 8px; }
  .boost { position: relative; aspect-ratio: 1 / 1.1; border-radius: 18px; background: linear-gradient(#fffdf8, #ffe8c0); border: 2.5px solid #e0a95e; box-shadow: inset 0 2px 0 #fff, 0 4px 0 #c0802f; display: grid; place-items: center; padding: 6px 6px 14px; }
  .boost > .gi { width: 100%; height: auto; max-width: 52px; }
  .boost .price { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 1px; padding: 2px 7px 2px 2px; border-radius: 999px; background: #2b1a0c; color: #fff; font: 700 13px/16px var(--font); white-space: nowrap; }
  .boost .price .gi { width: 16px; height: 16px; }
  .boost .tick { position: absolute; top: -9px; right: -9px; width: 28px; height: 28px; opacity: 0; transform: scale(0.3); transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.15s; }
  .boost[aria-pressed='true'] { background: linear-gradient(#f2ffe4, #cdf2a8); border-color: #4cb52c; box-shadow: inset 0 2px 0 #fff, 0 4px 0 #2b8a17; }
  .boost[aria-pressed='true'] .tick { opacity: 1; transform: scale(1); }
  .boost:disabled { filter: grayscale(1); opacity: 0.55; }
  .boost.nope { animation: nope 0.35s; }
  @keyframes nope { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .start-info { display: flex; justify-content: center; align-items: center; gap: 18px; }
  .start-info .timer-line { font-size: 26px; }

  /* Levels: chunky number tiles with stars. */
  .grid-levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .lvl { position: relative; aspect-ratio: 1; border-radius: 15px; background: linear-gradient(#66c4fa, #2486e0); border: 2px solid #12509c; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45), 0 3px 0 #12509c; display: grid; place-items: center; padding-bottom: 10px; font: 800 21px/1 var(--font); color: #fff; text-shadow: 0 1px 0 #12509c, 0 2px 0 #12509c; }
  .lvl.hard { background: linear-gradient(#ff8a6e, #dc3a26); border-color: #8c1d10; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45), 0 3px 0 #8c1d10; text-shadow: 0 1px 0 #8c1d10, 0 2px 0 #8c1d10; }
  .lvl.done { background: linear-gradient(#8fe066, #3aae2c); border-color: #1f7a1a; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45), 0 3px 0 #1f7a1a; text-shadow: 0 1px 0 #1f7a1a, 0 2px 0 #1f7a1a; }
  .lvl.current { animation: breathe 1.4s ease-in-out infinite; outline: 2px solid var(--gold); outline-offset: 2px; }
  .lvl:disabled { background: linear-gradient(#c3bfd6, #9a96b4); border-color: #6b6788; box-shadow: 0 3px 0 #6b6788; text-shadow: none; cursor: default; }
  .lvl .mini { position: absolute; bottom: 3px; left: 0; right: 0; display: flex; justify-content: center; gap: 0; }
  .lvl .mini .gi { width: 15px; height: 15px; }
  .lvl .flame { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; }
  .lvl .lockico { width: 26px; height: 26px; margin-top: 6px; }

  /* Settings */
  .toggles { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 4px 0; }
  .toggle { display: grid; justify-items: center; gap: 8px; font: 700 14px/1 var(--font); color: #fff; letter-spacing: 0.3px; }
  .toggle .disc { position: relative; width: 70px; height: 70px; padding: 14px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(#66c4fa, #2486e0); border: 2.5px solid #12509c; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45), 0 4px 0 #12509c, 0 8px 14px rgba(0, 0, 0, 0.2); }
  .toggle[aria-pressed='false'] .disc { background: linear-gradient(#c3bfd6, #8f8ba8); border-color: #5b5776; box-shadow: 0 4px 0 #5b5776; }
  .toggle[aria-pressed='false'] .disc::after { content: ''; position: absolute; width: 58px; height: 6px; border-radius: 3px; background: var(--alarm); border: 1.5px solid #fff; transform: rotate(-45deg); }
  .howto { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .howto li { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 12px; font: 700 17px/1.2 var(--font); color: var(--ink); }
  .howto li .gi { width: 52px; height: 52px; }
  .howto .demo { width: 52px; height: 52px; border-radius: 14px; background: var(--table); display: grid; place-items: center; overflow: hidden; }
  .howto .demo i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 15%, #2f6fe0 40%); animation: roll 1.6s ease-in-out infinite alternate; }
  @keyframes roll { from { transform: translateX(-14px); } to { transform: translateX(14px); } }

  /* Playtest tools (for the designer, not for players). */
  .setting { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
  .setting label { flex: 1 1 150px; font-weight: 700; }
  .setting small { display: block; font-weight: 400; color: var(--ink-soft); }
  .btn { padding: 9px 12px; border-radius: 12px; font: 600 14px/1 var(--font); background: #fff; color: var(--ink); box-shadow: inset 0 -3px 0 var(--cream-edge); }
  .seg { display: inline-flex; background: #fff; border-radius: 10px; padding: 3px; box-shadow: inset 0 -2px 0 var(--cream-edge); }
  .seg button { padding: 7px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .seg button[aria-pressed='true'] { background: var(--go); color: #fff; }
  .slider { display: grid; gap: 4px; }
  .slider .lab { display: flex; justify-content: space-between; font-size: 14px; }
  .slider .lab span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .slider input { width: 100%; accent-color: var(--go); }
  .note { font-size: 13px; }
  .note.ok { color: var(--go); }
  .note.bad { color: var(--alarm); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--cream-edge); white-space: nowrap; }
  th { color: var(--ink-soft); font-weight: 700; }
  .tools { user-select: text; -webkit-user-select: text; }

  /* ---------- Full-screen results: Success and Time's up ---------- */
  .result {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 14px;
    padding: calc(env(safe-area-inset-top, 0px) + 54px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px));
    background: radial-gradient(ellipse at 50% 38%, rgba(20, 70, 80, 0.7), rgba(6, 22, 28, 0.9) 75%);
    color: #fff;
    text-align: center;
    overflow-y: auto;
  }
  .result .wallet { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
  .result .title { width: min(330px, 88vw); animation: title-in 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
  .result .title text { font-family: var(--font); font-weight: 700; }
  @keyframes title-in { from { transform: scale(0.3) rotate(-8deg); opacity: 0; } }
  .result .stars { gap: 0; margin-top: -6px; }
  .result .stars .gi { width: 74px; height: 74px; animation: star-in 0.5s cubic-bezier(0.3, 1.7, 0.5, 1) both; }
  .result .stars .gi:nth-child(2) { width: 92px; height: 92px; margin-bottom: 14px; animation-delay: 0.18s; }
  .result .stars .gi:nth-child(3) { animation-delay: 0.36s; }
  .result .stars .gi:nth-child(1) { animation-delay: 0s; }
  @keyframes star-in { from { transform: scale(0) rotate(-90deg); opacity: 0; } }
  .result .panel { width: min(340px, 100%); display: grid; gap: 16px; justify-items: center; padding: 18px 16px; border-radius: 22px; background: linear-gradient(rgba(70, 84, 196, 0.85), rgba(47, 58, 150, 0.85)); border: 2.5px solid var(--frame-edge); box-shadow: 0 14px 32px rgba(0, 0, 0, 0.3); animation: card-in 0.35s 0.25s both; }
  .result .summary { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .result .time { display: inline-flex; align-items: center; gap: 7px; font: 800 22px/1 var(--font); color: #fff; }
  .result .time .gi { width: 30px; height: 30px; }
  .loot { display: inline-flex; align-items: center; gap: 8px; animation: title-in 0.6s 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
  .loot .gi { width: 46px; height: 46px; }
  .loot b { font: 800 36px/1 var(--font); color: #ffe7a6; text-shadow: 0 2px 0 #8a5a12, 0 3px 10px rgba(0, 0, 0, 0.35); }
  .loot b.bump { animation: bump 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .result .panel .gbtn.blue .cost { font-size: 1.1em; }
  .result .stack .linkish { justify-self: center; font-size: 15px; color: #dfe6f5; }
  .mult { position: relative; display: flex; gap: 4px; padding: 5px; border-radius: 16px; background: rgba(16, 32, 48, 0.55); border: 2px solid var(--hairline); }
  .mult span { width: 54px; height: 42px; border-radius: 11px; display: grid; place-items: center; font: 800 21px/1 var(--font); border: 2px solid rgba(0, 0, 0, 0.22); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45); }
  .mult span[data-m='2'] { background: linear-gradient(#ff8270, #dc3a26); }
  .mult span[data-m='3'] { background: linear-gradient(#ffbe5c, #f57c20); }
  .mult span[data-m='5'] { background: linear-gradient(#8fe066, #3aae2c); }
  .mult span.hit { outline: 2px solid var(--gold); outline-offset: 2px; animation: bump 0.5s; }
  .mult .pointer { position: absolute; bottom: -20px; left: 0; width: 26px; height: 22px; margin-left: -13px; transform: translateX(var(--x, 0px)); }
  .mult .pointer::before { content: ''; position: absolute; inset: 0; background: var(--gold); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .mult.idle .pointer { animation: sweep 1.3s ease-in-out infinite alternate; }
  @keyframes sweep { from { transform: translateX(14px); } to { transform: translateX(calc(var(--w) - 14px)); } }
  .result .actions { display: flex; gap: 12px; width: min(360px, 100%); margin-top: 12px; }
  .result .actions .gbtn { flex: 1 1 0; }
  .result .stack { display: grid; gap: 14px; width: min(320px, 100%); }
  .result .minor { display: flex; gap: 16px; justify-content: center; margin-top: 4px; }
  .result .shake { width: 120px; height: 120px; animation: shake 0.6s 0.3s both; }
  @keyframes shake { 20%, 60% { transform: rotate(-12deg); } 40%, 80% { transform: rotate(12deg); } }
  .result .chips .chip-marble { width: 22px; height: 22px; }

  /* ---------- Little animations ---------- */
  .fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; left: 50%; top: 42%; display: grid; justify-items: center; gap: 2px; transform: translate(-50%, -50%); animation: pop 1.3s ease-out forwards; }
  .pop .gi { width: 88px; height: 88px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3)); }
  .pop b { font: 800 30px/1 var(--font); }
  @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { transform: translate(-50%, -110%) scale(0.9); opacity: 0; } }
  .broken { position: absolute; left: 50%; top: 45%; width: 150px; height: 150px; margin: -75px 0 0 -75px; }
  .broken .half { position: absolute; inset: 0; }
  .broken .half.l { clip-path: polygon(0 0, 52% 0, 44% 30%, 56% 48%, 44% 66%, 52% 100%, 0 100%); animation: fall-l 1.1s 0.35s ease-in forwards; }
  .broken .half.r { clip-path: polygon(52% 0, 100% 0, 100% 100%, 52% 100%, 44% 66%, 56% 48%, 44% 30%); animation: fall-r 1.1s 0.35s ease-in forwards; }
  .broken.go { animation: heart-shake 0.35s; }
  .broken .minus { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font: 800 48px/1 var(--font); animation: rise 1.4s 0.35s ease-out both; }
  @keyframes heart-shake { 25% { transform: rotate(-8deg) scale(1.08); } 75% { transform: rotate(8deg) scale(1.08); } }
  @keyframes fall-l { to { transform: translate(-60px, 260px) rotate(-40deg); opacity: 0; } }
  @keyframes fall-r { to { transform: translate(60px, 260px) rotate(40deg); opacity: 0; } }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(-90px); opacity: 0; } }
  .flyer { position: absolute; width: 34px; height: 34px; transition: transform 0.7s cubic-bezier(0.5, -0.3, 0.7, 0.4), opacity 0.7s; }
  .test-ad { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 16px; background: #111; color: #fff; font: 600 18px/1.3 var(--font); text-align: center; padding: 24px; }
  .test-ad .ring { font: 700 46px/1 var(--font); width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; border: 6px solid #6fcfff; }
  .test-ad small { opacity: 0.7; font-size: 14px; max-width: 18rem; }
  .test-ad .skip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; padding: 8px 14px; border-radius: 10px; background: #333; color: #fff; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body class="at-home">
<canvas id="stage" aria-label="The wooden marble machine. Drag to tilt it."></canvas>

<header class="top">
  <div class="left"><button class="gbtn indigo square" id="pauseBtn" type="button" aria-label="Pause" data-icon="pause"></button></div>
  <div class="centre">
    <span class="pill" id="livesPill" aria-label="Lives"><span data-icon="heart"></span><b id="livesCount">5</b></span>
    <div class="clock" id="clock" aria-live="off">
      <div class="face"><span data-icon="clock"></span><span class="num ol" id="time">20</span></div>
      <div class="bar"><i id="timeBar"></i></div>
      <div class="paused" id="timerNote" hidden>Tilt to start</div>
    </div>
    <span class="pill" id="coinsPill" aria-label="Gold coins"><span data-icon="coin"></span><b id="coinsCount">0</b></span>
  </div>
  <div></div>
</header>

<div class="sub">
  <div class="level-label ol" id="levelLabel">Level 1</div>
  <div class="chips" id="chips" aria-label="Marbles delivered"></div>
  <div class="hint" id="hint"></div>
</div>

<footer class="bottom">
  <div class="powerbar" id="powerbar" role="toolbar" aria-label="Power-ups" hidden></div>
  <div class="controls">
    <button class="gbtn cream round" id="orbitLeft" type="button" aria-label="Turn the view left" data-icon="orbitLeft"></button>
    <button class="gbtn orange round" id="restartBtn" type="button" aria-label="Restart" data-icon="restart"></button>
    <button class="gbtn cream round" id="orbitRight" type="button" aria-label="Turn the view right" data-icon="orbitRight"></button>
  </div>
</footer>
<section class="ptag" id="ptag" hidden aria-live="polite"></section>

<section class="home-screen" id="home" aria-label="Home">
  <div class="home-bar">
    <button class="profile" id="profileBtn" type="button" aria-label="Profile (coming soon)" data-icon="profile"></button>
    <div class="wallet">
      <button class="pill lives" id="homeLives" type="button"><span data-icon="heart"></span><span class="heart-n" id="homeLivesCount">5</span><small id="homeLivesText">Full</small></button>
      <button class="pill" id="homeCoins" type="button"><span data-icon="coin"></span><b id="homeCoinsText">0</b></button>
    </div>
    <button class="gbtn indigo square" id="homeSettings" type="button" aria-label="Settings" data-icon="gear"></button>
  </div>
  <svg class="logo" viewBox="0 0 330 112" role="img" aria-label="Marble Machine Rush">
    <text x="165" y="48" text-anchor="middle" font-size="40" fill="#fff" letter-spacing="1" style="filter: drop-shadow(0 2px 3px rgba(10,40,45,.45))">Marble Machine</text>
    <text x="165" y="100" text-anchor="middle" font-size="50" fill="url(#mm-gold)" stroke="#7a5414" stroke-width="3" stroke-linejoin="round" paint-order="stroke" letter-spacing="6" style="filter: drop-shadow(0 2px 3px rgba(10,40,45,.45))">RUSH</text>
  </svg>
  <div class="home-play">
    <div class="home-level ol" id="homeLevel">Level 1</div>
    <button class="gbtn big ready" id="playBtn" type="button">Play</button>
  </div>
  <div class="home-foot">
    <button class="gbtn cream" id="homeLevels" type="button" aria-label="Levels" data-icon="levels"></button>
  </div>
</section>

<div class="scrim" id="scrim" hidden><section class="card" id="card" role="dialog" aria-modal="true"></section></div>
<section class="result" id="result" hidden aria-live="polite"></section>
<div class="fx" id="fx" aria-hidden="true"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
