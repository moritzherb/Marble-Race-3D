<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Marble Machine Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap">
<style>
  /* Layout: full-screen 3D stage; HUD pinned to the top and bottom edges; cards float over a teal scrim. */
  :root {
    --table: #39aeb1;       /* the teal studio backdrop from the reference photo */
    --table-deep: #1f7c80;
    --maple: #f4e7cf;       /* pale wood for HUD tokens and cards */
    --maple-edge: #d8bc90;
    --ink: #3b2915;
    --ink-soft: #725a3f;
    --go: #1f7c80;
    --alarm: #d8432b;
    --gold: #e0a92e;
    --scrim: rgba(18, 74, 77, 0.55);
    --font-display: 'Arimo', Arial, 'Helvetica Neue', sans-serif;
    --font-body: 'Arimo', Arial, 'Helvetica Neue', sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--table);
    color: var(--ink);
    font: 15px/1.4 var(--font-body);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none; /* no long-press menu or text magnifier on iPhone */
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    background: radial-gradient(ellipse at 50% 42%, #44b9bc 0%, var(--table) 55%, #2f9fa3 100%);
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .token {
    background: var(--maple);
    border-radius: 12px;
    box-shadow: inset 0 -3px 0 var(--maple-edge), 0 2px 6px rgba(0, 0, 0, 0.12);
    padding: 8px 14px;
    font-weight: 700;
    color: var(--ink);
  }
  .token:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 var(--maple-edge); }

  .top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 8px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .top .left { justify-self: start; }
  .top .side { display: grid; justify-items: center; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px; background: rgba(18, 74, 77, 0.78); color: #fff; font: 700 14px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .pill svg { width: 15px; height: 15px; }
  .heart { color: #ff6b57; }
  .resources { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .res { display: inline-flex; align-items: center; gap: 7px; font: 700 16px/1 var(--font-display); font-variant-numeric: tabular-nums; padding: 9px 14px 11px; }
  .res svg { width: 20px; height: 20px; }
  .res .heart { color: var(--alarm); }
  .big-stat { display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .big-stat svg { width: 40px; height: 40px; }
  .big-stat .heart { color: var(--alarm); }
  .countdown { text-align: center; font: 600 17px/1.2 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); }
  .cost { white-space: nowrap; opacity: 0.9; }
  .cost svg { width: 0.95em; height: 0.95em; vertical-align: -0.12em; }
  .btn.primary .heart, .restart .heart { color: #ffb3a6; }
  .top .right { justify-self: end; }
  .clock { text-align: center; color: #fff; }
  .clock .num {
    font: 700 44px/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 var(--table-deep);
    letter-spacing: 0.5px;
  }
  .clock.low .num { color: #ffe1d6; animation: pulse 1s ease-in-out infinite; }
  .clock .bar { width: 120px; height: 6px; margin: 6px auto 0; border-radius: 3px; background: rgba(0, 0, 0, 0.18); overflow: hidden; }
  .clock .bar i { display: block; height: 100%; width: 100%; background: #fff; border-radius: 3px; transform-origin: left; }
  .clock.low .bar i { background: var(--alarm); }
  .clock .paused { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85; margin-top: 4px; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  .sub {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 82px);
    left: 0;
    right: 0;
    display: grid;
    justify-items: center;
    gap: 8px;
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .level-label { color: #fff; font: 500 15px/1.2 var(--font-display); letter-spacing: 0.3px; text-shadow: 0 1px 0 var(--table-deep); }
  .level-label b { opacity: 0.75; font-weight: 500; margin-right: 6px; }
  .chips { display: flex; gap: 8px; }
  .chip-marble {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 3px solid var(--c);
    background: transparent;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    transition: background 0.2s;
  }
  .chip-marble.delivered { background: var(--c); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85); }
  .hint {
    max-width: min(19rem, 100%);
    background: rgba(255, 255, 255, 0.9);
    color: var(--ink);
    padding: 5px 11px;
    border-radius: 9px;
    text-align: center;
    font-size: 12.5px;
    line-height: 1.3;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    transition: opacity 0.4s;
  }
  .hint.gone { opacity: 0; }

  .bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  .round { width: 48px; height: 48px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  .round svg { width: 24px; height: 24px; }
  .restart { padding: 12px 22px; font: 600 17px/1 var(--font-display); }

  .banner {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--maple);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 13px;
    white-space: nowrap;
  }

  .scrim {
    position: fixed;
    inset: 0;
    background: var(--scrim);
    display: grid;
    grid-template-columns: minmax(0, 420px);
    justify-content: center;
    align-content: center;
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-y: auto;
  }
  .card {
    min-width: 0;
    background: var(--maple);
    border-radius: 18px;
    box-shadow: inset 0 -5px 0 var(--maple-edge), 0 10px 30px rgba(0, 0, 0, 0.25);
    padding: 20px 20px 24px;
    display: grid;
    gap: 14px;
    max-height: 100%;
    overflow-y: auto;
    user-select: text;
    -webkit-user-select: text;
  }
  .card h2 { margin: 0; font: 600 26px/1.15 var(--font-display); text-wrap: balance; }
  .card h3 { margin: 6px 0 0; font: 600 13px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); }
  .card p { margin: 0; color: var(--ink-soft); }
  .card .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .card .row > button { flex: 1 1 auto; }
  .btn { padding: 12px 16px; border-radius: 12px; font: 600 16px/1 var(--font-display); background: #fff; box-shadow: inset 0 -3px 0 var(--maple-edge); }
  .btn.primary { background: var(--go); color: #fff; box-shadow: inset 0 -3px 0 #135a5d; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .stars { display: flex; gap: 6px; justify-content: center; }
  .stars svg { width: 44px; height: 44px; }
  .result-time { text-align: center; font: 600 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .targets { text-align: center; font-size: 14px; color: var(--ink-soft); }
  .grid-levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .grid-levels button {
    text-align: left;
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    box-shadow: inset 0 -3px 0 var(--maple-edge);
    display: grid;
    gap: 4px;
    min-width: 0;
  }
  .grid-levels button.current { outline: 3px solid var(--go); }
  .grid-levels button:disabled { cursor: not-allowed; background: transparent; box-shadow: inset 0 0 0 2px var(--maple-edge); color: var(--ink-soft); }
  .grid-levels .lock { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .grid-levels .lock svg { width: 13px; height: 13px; }
  .grid-levels .n { font: 600 22px/1 var(--font-display); }
  .grid-levels .name { font-size: 13px; line-height: 1.2; }
  .grid-levels .got { font-size: 13px; color: var(--gold); letter-spacing: 1px; }
  .setting { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
  .setting label { flex: 1 1 150px; }
  .setting label { font-weight: 700; }
  .setting small { display: block; font-weight: 400; color: var(--ink-soft); }
  .seg { display: inline-flex; background: #fff; border-radius: 10px; padding: 3px; box-shadow: inset 0 -2px 0 var(--maple-edge); }
  .seg button { padding: 7px 10px; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 700; }
  .seg button[aria-pressed='true'] { background: var(--go); color: #fff; }
  .slider { display: grid; gap: 4px; }
  .slider .lab { display: flex; justify-content: space-between; font-size: 14px; }
  .slider .lab span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .slider input { width: 100%; accent-color: var(--go); }
  .note { font-size: 13px; }
  .note.ok { color: var(--go); }
  .note.bad { color: var(--alarm); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--maple-edge); white-space: nowrap; }
  th { color: var(--ink-soft); font-weight: 700; }
  ul.howto { margin: 0; padding-left: 18px; color: var(--ink-soft); display: grid; gap: 4px; }
  /* Home screen: the next machine turns slowly behind a big Play button. */
  body.at-home :is(.top, .sub, .bottom, .banner),
  body:has(#home:not([hidden])) :is(.top, .sub, .bottom, .banner) { display: none; }
  .home-screen {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 22px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to bottom, rgba(23, 96, 99, 0.5), rgba(23, 96, 99, 0) 28%, rgba(23, 96, 99, 0) 72%, rgba(23, 96, 99, 0.4));
    pointer-events: none;
    color: #fff;
    text-align: center;
  }
  .home-screen button { pointer-events: auto; }
  .home-screen h1 { margin: 0; font: 700 32px/1.1 var(--font-display); letter-spacing: 0.2px; text-wrap: balance; text-shadow: 0 2px 0 var(--table-deep); }
  .home-screen .progress { margin: 8px 0 0; font-size: 14px; opacity: 0.92; }
  .home-play { display: grid; place-content: center; justify-items: center; gap: 16px; }
  .next-card { display: grid; gap: 3px; padding: 8px 18px 10px; border-radius: 14px; background: rgba(18, 74, 77, 0.82); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18); }
  .home-screen .next { margin: 0; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; opacity: 0.85; }
  .home-screen .level { margin: 0; font: 700 19px/1.2 var(--font-display); }
  .play {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    /* 5px more at the bottom balances the pressed-edge shadow, so content centres on the visible face */
    padding: 16px 36px 21px;
    line-height: 1;
    border-radius: 999px;
    background: var(--maple);
    color: var(--ink);
    font: 700 26px/1 var(--font-display);
    box-shadow: inset 0 -5px 0 var(--maple-edge), 0 10px 26px rgba(0, 0, 0, 0.22);
  }
  .play svg { width: 20px; height: 24px; color: var(--go); flex: none; }
  .play:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--maple-edge), 0 6px 16px rgba(0, 0, 0, 0.2); }
  .home-foot { display: flex; justify-content: center; gap: 12px; }
  .icon-btn { width: 54px; height: 54px; padding: 0; border-radius: 16px; display: grid; place-items: center; color: var(--go); }
  .icon-btn svg { width: 28px; height: 28px; }
  /* Simple settings: a row of big round toggles. */
  .card-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; }
  .card-head h2 { grid-column: 2; text-align: center; }
  .close-btn { grid-column: 3; width: 40px; height: 40px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: #fff; box-shadow: inset 0 -3px 0 var(--maple-edge); color: var(--ink); }
  .close-btn svg { width: 18px; height: 18px; }
  .toggles { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; padding: 6px 0 4px; }
  .toggle { display: grid; justify-items: center; gap: 8px; background: none; padding: 0; font: 700 15px/1 var(--font-display); color: var(--ink); }
  .toggle .disc { position: relative; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: var(--go); color: #fff; box-shadow: inset 0 -5px 0 #135a5d; }
  .toggle .disc svg { width: 34px; height: 34px; }
  .toggle[aria-pressed='false'] .disc { background: #b9ab93; box-shadow: inset 0 -5px 0 #978a73; }
  .toggle[aria-pressed='false'] .disc::after { content: ''; position: absolute; width: 58px; height: 5px; border-radius: 3px; background: var(--alarm); transform: rotate(-45deg); }
  .btn.wide { width: 100%; padding: 15px 16px; font-size: 18px; }
  .fine { text-align: center; font-size: 13px; color: var(--ink-soft); }
  .linkish { background: none; padding: 4px; color: var(--ink-soft); text-decoration: underline; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) {
    .clock.low .num { animation: none; }
    .hint { transition: none; }
  }
</style>
</head>
<body class="at-home">
<canvas id="stage" aria-label="The wooden marble machine. Drag to tilt it."></canvas>

<header class="top">
  <div class="left side">
  <button class="token icon-btn" id="homeBtn" type="button" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2 2.6 11.1a1 1 0 0 0 1.3 1.5l.9-.8V20a1 1 0 0 0 1 1h4.2v-5.6h4v5.6h4.2a1 1 0 0 0 1-1v-8.2l.9.8a1 1 0 0 0 1.3-1.5Z"/></svg></button>
  <span class="pill" id="livesPill" aria-label="Lives"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.2s-7.6-4.7-9.7-9.4C.8 8.3 2.9 4.4 6.7 4.4c2.1 0 3.6 1.2 5.3 3.3 1.7-2.1 3.2-3.3 5.3-3.3 3.8 0 5.9 3.9 4.4 7.4-2.1 4.7-9.7 9.4-9.7 9.4z"/></svg><b id="livesCount">5</b></span>
  </div>
  <div class="clock" id="clock" aria-live="off">
    <div class="num" id="time">20</div>
    <div class="bar"><i id="timeBar"></i></div>
    <div class="paused" id="timerNote" hidden>Starts on first tilt</div>
  </div>
  <button class="token icon-btn right" id="settingsBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M20.30 12.00 L22.55 13.00 L22.13 15.12 L19.67 15.18 L18.90 16.61 L17.87 17.87 L18.76 20.17 L16.96 21.37 L15.18 19.67 L13.62 20.14 L12.00 20.30 L11.00 22.55 L8.88 22.13 L8.82 19.67 L7.39 18.90 L6.13 17.87 L3.83 18.76 L2.63 16.96 L4.33 15.18 L3.86 13.62 L3.70 12.00 L1.45 11.00 L1.87 8.88 L4.33 8.82 L5.10 7.39 L6.13 6.13 L5.24 3.83 L7.04 2.63 L8.82 4.33 L10.38 3.86 L12.00 3.70 L13.00 1.45 L15.12 1.87 L15.18 4.33 L16.61 5.10 L17.87 6.13 L20.17 5.24 L21.37 7.04 L19.67 8.82 L20.14 10.38Z M15.40 12 A3.4 3.4 0 1 0 8.60 12 A3.4 3.4 0 1 0 15.40 12Z"/></svg></button>
</header>

<div class="sub">
  <div class="level-label"><b id="levelNum">1</b><span id="levelName">First Tilt</span></div>
  <div class="chips" id="chips" aria-label="Marbles delivered"></div>
  <div class="hint" id="hint"></div>
</div>

<footer class="bottom">
  <button class="token round" id="orbitLeft" type="button" aria-label="Turn the view left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>
  </button>
  <button class="token restart" id="restartBtn" type="button">Restart</button>
  <button class="token round" id="orbitRight" type="button" aria-label="Turn the view right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>
  </button>
</footer>

<section class="home-screen" id="home" aria-label="Home">
  <div>
    <h1>Marble Machine Rush</h1>
    <p class="progress" id="homeProgress">0 of 100 levels complete</p>
  </div>
  <div class="home-play">
    <div class="resources">
      <button class="token res" id="homeLives" type="button"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.2s-7.6-4.7-9.7-9.4C.8 8.3 2.9 4.4 6.7 4.4c2.1 0 3.6 1.2 5.3 3.3 1.7-2.1 3.2-3.3 5.3-3.3 3.8 0 5.9 3.9 4.4 7.4-2.1 4.7-9.7 9.4-9.7 9.4z"/></svg><span id="homeLivesText">5/5 · Full</span></button>
    </div>
    <div class="next-card">
      <p class="next" id="homeNext">Next level</p>
      <p class="level"><span id="homeNum">1</span> · <span id="homeName">First Tilt</span></p>
    </div>
    <button class="play" id="playBtn" type="button">
      <svg viewBox="7 3.6 14 16.8" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.87l12-7.5a1 1 0 0 0 0-1.74l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>
      Play
    </button>
  </div>
  <div class="home-foot">
    <button class="token" id="homeLevels" type="button">Levels</button>
    <button class="token" id="homeSettings" type="button">Settings</button>
  </div>
</section>

<div class="banner" id="banner" hidden></div>
<div class="scrim" id="scrim" hidden><section class="card" id="card" role="dialog" aria-modal="true"></section></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
